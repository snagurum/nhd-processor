# spring.profiles.active=postgresdb
spring.profiles.active=local
#spring.profiles.active=supa

spring.application.name=nhd-processor
spring.database.driverClassName=org.postgresql.Driver

server.port=8081
server.servlet.context-path=/re

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=re
spring.liquibase.liquibase-schema=re

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{20} : %msg%n
logging.level.com.nhd.processor.services.StockPriceLoaderService=INFO
