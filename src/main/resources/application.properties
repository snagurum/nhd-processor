# spring.profiles.active=postgresdb
spring.profiles.active=local
#spring.profiles.active=supa

spring.application.name=nhd-processor
spring.database.driverClassName=org.postgresql.Driver

processor.pagination-page-size=2000
processor.api-stock-stats-page-size=1000
processor.etl-ticker-chunk-size=250
processor.etl-default-from-date=1996-01-01
processor.etl-momentum-from-date=2014-01-01
processor.persistence-jdbc-batch-size=10000
processor.persistence-flush-stock-price=50000
processor.persistence-flush-stock-stats=500000
processor.persistence-flush-momentum-stats=50000
processor.persistence-flush-momentum-z-stats=10000
processor.persistence-flush-momentum-z-stats-score=50000
processor.loader-client-connect-timeout=10s
processor.loader-client-read-timeout=60s

server.port=8081
server.servlet.context-path=/re

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=re
spring.liquibase.liquibase-schema=re

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{20} : %msg%n
logging.level.com.nhd.processor.services.StockPriceLoaderService=INFO
