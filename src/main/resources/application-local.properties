spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_DB:nse}?reWriteBatchedInserts=true
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PWD:postgres}
spring.jpa.properties.hibernate.jdbc.batch_size=20000
spring.jpa.properties.hibernate.order_inserts=true


app.loader.url=http://localhost:8080/loader
app.nse.url=http://localhost:8082/nse
